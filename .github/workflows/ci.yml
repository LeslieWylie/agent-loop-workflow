name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The harness packages are devDependencies rather than optional peers on
      # purpose: npm does not auto-install optional peers, so declaring them
      # that way leaves tests/boot.test.mjs unable to resolve a Context and
      # quietly skipping every run — a green tick over an integration test that
      # never executed. Look for "--- harness boot ---" in this step's log; if
      # it says SKIPPED, treat the run as unverified.
      #
      # @deepseek-ai/dsh-skill is pinned to an exact version because its npm
      # `latest` tag points at 0.0.1-rc.1, several minors behind the 0.1.x line
      # that shipping harnesses actually run. A caret range resolves to the
      # stale one.
      - run: npm install
      - run: npm test

  # The suite's own guard only covers the *registered payload*. This job covers
  # the rest of the tree — README prose, the patch file, package metadata, and
  # the tests themselves — because the leak that prompted all of this lived in a
  # test file, which is exactly where nobody thinks to look.
  no-identifiers-in-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scan the tree, and prove the scanner works
        run: bash tools/scan-tree.sh
