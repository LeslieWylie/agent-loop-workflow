name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the suite uses only node:test and node:assert, and the
      # package has no dependencies. Nothing to resolve, nothing to cache.
      - run: npm test

  # The suite's own guard only covers the *registered payload*. This job covers
  # the rest of the tree — README prose, the patch file, package metadata, and
  # the tests themselves — because the leak that prompted all of this lived in a
  # test file, which is exactly where nobody thinks to look.
  no-identifiers-in-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scan the tree, and prove the scanner works
        run: bash tools/scan-tree.sh
